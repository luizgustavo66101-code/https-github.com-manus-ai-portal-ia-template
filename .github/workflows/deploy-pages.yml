name: Deploy static content to Pages

on:
  push:
    branches: ["main", "fix/deploy-automated"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Commit package-lock.json (if created)
        if: exists('package-lock.json')
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json || true
          git commit -m "chore: add package-lock.json" || echo "no changes to commit"
          git push origin HEAD:$BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Update DEPLOYMENT_STATUS.md
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "# Deployment status" > DEPLOYMENT_STATUS.md
          echo "" >> DEPLOYMENT_STATUS.md
          echo "- timestamp: $TIMESTAMP" >> DEPLOYMENT_STATUS.md
          echo "- status: $STATUS" >> DEPLOYMENT_STATUS.md
          echo "- pages_url: $PAGE_URL" >> DEPLOYMENT_STATUS.md
          echo "- run_url: $RUN_URL" >> DEPLOYMENT_STATUS.md
          
      - name: Create Pull Request with deployment changes
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore(pages): update deployment artifacts
          branch: automation/deploy-${{ github.run_id }}
          title: chore(pages): update deployment artifacts (run ${{ github.run_id }})
          body: |
            This PR was created automatically by the Pages deploy workflow. It contains any updated artifacts such as package-lock.json and DEPLOYMENT_STATUS.md.
          base: main
          labels: automated, deployment
